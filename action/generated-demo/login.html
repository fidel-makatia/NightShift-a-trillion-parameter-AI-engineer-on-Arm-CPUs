<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NightShift — Sign in</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b0e14;
    color: #e6e9f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(99, 102, 241, 0.12), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(168, 85, 247, 0.10), transparent 55%);
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: #151a24;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 40px 36px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }

  .brand {
    text-align: center;
    margin-bottom: 32px;
  }

  .brand .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    margin-bottom: 14px;
    font-size: 20px;
  }

  .brand h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .brand p {
    margin-top: 6px;
    font-size: 14px;
    color: #8b93a7;
  }

  form .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #aab2c5;
    margin-bottom: 7px;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    color: #e6e9f0;
    background: #0f131b;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: #818cf8;
    box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.18);
  }

  input::placeholder {
    color: #5c6577;
  }

  .btn {
    width: 100%;
    margin-top: 8px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 60%, #ec4899 100%);
    transition: filter 0.2s, transform 0.15s;
  }

  .btn:hover {
    filter: brightness(1.12);
  }

  .btn:active {
    transform: scale(0.99);
  }

  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 13px;
    color: #8b93a7;
  }

  .footer a {
    color: #a5b4fc;
    text-decoration: none;
  }

  .footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">🌙</div>
      <h1>NightShift</h1>
      <p>Welcome back. Sign in to continue.</p>
    </div>
    <form>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
    <div class="footer">
      <a href="#">Forgot your password?</a>
    </div>
  </div>
</body>
</html>
